<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Статистика теста — KnowledgeControl</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="topbar"></header>
  <main class="container">
    <div class="page-header">
      <div>
        <h1 id="test-title">Статистика теста</h1>
        <p class="page-subtitle" id="last-attempt-meta">Агрегированные показатели прохождений</p>
      </div>
      <a href="tests.html" class="btn">Назад</a>
    </div>

    <div id="alert" class="alert"></div>

    <div class="grid-3">
      <div class="card">
        <div class="muted">Всего попыток</div>
        <div id="stat-attempts" class="mono" style="font-size:26px;font-weight:700;margin-top:4px;">—</div>
      </div>
      <div class="card">
        <div class="muted">Успешных прохождений</div>
        <div id="stat-passed" class="mono" style="font-size:26px;font-weight:700;margin-top:4px;">—</div>
      </div>
      <div class="card">
        <div class="muted">Процент сдачи (Pass Rate)</div>
        <div id="stat-pass-rate" class="mono" style="font-size:26px;font-weight:700;margin-top:4px;">—</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="muted">Средний результат</div>
        <div id="stat-avg-score" class="mono" style="font-size:24px;font-weight:700;margin-top:4px;">—</div>
      </div>
      <div class="card">
        <div class="muted">Последняя попытка</div>
        <div id="stat-last-date" class="mono" style="font-size:18px;font-weight:600;margin-top:8px;">—</div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();
    renderNavbar('tests');
    const testUid = new URLSearchParams(window.location.search).get('testUid');

    async function loadStats() {
      if (!testUid) {
        showAlert('alert', 'Не указан идентификатор теста.');
        return;
      }

      // Параллельно пробуем получить название теста для заголовка
      apiRequest('creation', `/api/tests/${testUid}`)
        .then(test => {
          if (test?.title) {
            document.getElementById('test-title').textContent = `Статистика: ${test.title}`;
          }
        })
        .catch(() => {});

      try {
        const stats = await apiRequest('search', `/api/stats/${testUid}`);
        document.getElementById('stat-attempts').textContent = stats.totalAttempts ?? 0;
        document.getElementById('stat-passed').textContent = stats.passedAttempts ?? 0;
        document.getElementById('stat-pass-rate').textContent = `${Number(stats.passRate ?? 0).toFixed(1)}%`;
        document.getElementById('stat-avg-score').textContent = `${Number(stats.avgScore ?? 0).toFixed(1)}%`;
        document.getElementById('stat-last-date').textContent = stats.lastAttemptAt
          ? new Date(stats.lastAttemptAt).toLocaleString('ru-RU')
          : 'Ещё не проходили';
      } catch (err) {
        if (err.message.includes('не найдена')) {
          document.getElementById('stat-attempts').textContent = '0';
          document.getElementById('stat-passed').textContent = '0';
          document.getElementById('stat-pass-rate').textContent = '0%';
          document.getElementById('stat-avg-score').textContent = '—';
          document.getElementById('stat-last-date').textContent = 'Нет завершённых попыток';
          showAlert('alert', 'По этому тесту ещё нет завершённых попыток.', 'success');
        } else {
          showAlert('alert', err.message);
        }
      }
    }

    loadStats();
  </script>
</body>
</html>
