server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Статика фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }

    # UserService
    location /api/auth/ { proxy_pass http://user-service:8080; }
    location /api/users/ { proxy_pass http://user-service:8080; }

    # TestCreationService
    location /api/questions { proxy_pass http://test-creation-service:8080; }
    location /api/moderation/ { proxy_pass http://test-creation-service:8080; }

    # TestTakingService
    location /api/attempts/ { proxy_pass http://test-taking-service:8080; }

    # SearchService (каталог и поиск) vs TestCreationService (CRUD тестов)
    # Если пути /api/tests пересекаются, проще в api.js оставить разные порты + включить CORS в .NET
    location /api/tests { proxy_pass http://search-service:8080; }
}