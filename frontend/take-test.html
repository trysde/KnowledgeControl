<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Прохождение теста — KnowledgeControl</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="topbar"></header>
  <main class="container" style="max-width:780px;">
    <div class="page-header">
      <div>
        <h1 id="test-title">Загрузка теста...</h1>
        <p class="page-subtitle" id="test-meta"></p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="save-status" class="muted"></span>
        <div id="timer" class="badge mono" style="font-size:14px;padding:6px 10px;display:none;"></div>
      </div>
    </div>

    <div id="alert" class="alert"></div>
    <form id="attempt-form">
      <div id="questions-container"></div>
      <button type="submit" id="submit-btn" class="btn btn-primary" style="display:none;">Завершить тест и узнать результат</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();
    renderNavbar();

    const params = new URLSearchParams(window.location.search);
    const testUid = params.get('testUid');
    let attemptUid = params.get('attemptUid');
    let questions = [];
    let timerInterval = null;
    let isFinishing = false;

    async function initAttempt() {
      if (!attemptUid && !testUid) {
        showAlert('alert', 'Не указан testUid или attemptUid в адресной строке.');
        return;
      }

      try {
        let attemptData;
        if (attemptUid) {
          attemptData = await apiRequest('taking', `/api/attempts/${attemptUid}`);
          if (attemptData.status === 'Completed') {
            window.location.href = `result.html?attemptUid=${attemptUid}`;
            return;
          }
          if (attemptData.status === 'Expired') {
            showAlert('alert', 'Время на прохождение этой попытки уже истекло.');
            return;
          }
        } else {
          attemptData = await apiRequest('taking', `/api/attempts/start?testUid=${encodeURIComponent(testUid)}`, {
            method: 'POST'
          });
          attemptUid = attemptData.attemptUid;
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set('attemptUid', attemptUid);
          window.history.replaceState({}, '', nextUrl.toString());
        }

        const snapshot = attemptData.testSnapshot;
        questions = (snapshot?.questions || []).slice().sort((a, b) => a.orderIndex - b.orderIndex);

        const savedMap = new Map();
        (attemptData.answers || []).forEach(ans => {
          savedMap.set(ans.questionUid, ans);
        });

        document.getElementById('test-title').textContent = snapshot?.title || 'Тестирование';
        document.getElementById('test-meta').textContent =
          `Вопросов: ${questions.length} · Проходной балл: ${snapshot?.passingScore ?? 0}%`;

        if (attemptData.expiresAt) {
          startTimer(new Date(attemptData.expiresAt));
        }

        const container = document.getElementById('questions-container');
        container.innerHTML = questions.map((q, idx) => {
          const saved = savedMap.get(q.questionUid);
          return `
            <div class="card" data-question-uid="${q.questionUid}">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <strong>Вопрос ${idx + 1}: ${escapeHtml(q.title)}</strong>
                <span class="mono muted">${q.points} б.</span>
              </div>
              <p style="margin:0 0 12px;">${escapeHtml(q.text)}</p>
              ${renderInputs(q, saved)}
            </div>
          `;
        }).join('');

        document.getElementById('submit-btn').style.display = 'inline-flex';
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    function renderInputs(q, saved) {
      if (q.questionType === 'TextInput') {
        const val = saved?.textAnswer || '';
        return `
          <input
            type="text"
            name="q_${q.questionUid}"
            maxlength="500"
            value="${escapeHtml(val)}"
            placeholder="Введите ответ..."
            onchange="saveSingleAnswer('${q.questionUid}')">
        `;
      }

      const selectedSet = new Set(saved?.selectedOptionUids || []);
      const inputType = q.questionType === 'MultipleChoice' ? 'checkbox' : 'radio';
      const sortedOptions = (q.options || []).slice().sort((a, b) => a.position - b.position);

      return sortedOptions.map(o => `
        <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:400;cursor:pointer;">
          <input
            type="${inputType}"
            name="q_${q.questionUid}"
            value="${o.uid}"
            ${selectedSet.has(o.uid) ? 'checked' : ''}
            onchange="saveSingleAnswer('${q.questionUid}')">
          <span>${escapeHtml(o.text)}</span>
        </label>
      `).join('');
    }

    function collectQuestionPayload(q) {
      if (q.questionType === 'TextInput') {
        const raw = document.querySelector(`input[name="q_${q.questionUid}"]`)?.value || '';
        const trimmed = raw.trim();
        if (!trimmed) return null;
        return {
          questionUid: q.questionUid,
          selectedOptionUids: [],
          textAnswer: trimmed
        };
      }

      const checked = Array.from(document.querySelectorAll(`input[name="q_${q.questionUid}"]:checked`))
        .map(el => el.value);
      if (!checked.length) return null;

      return {
        questionUid: q.questionUid,
        selectedOptionUids: checked,
        textAnswer: null
      };
    }

    async function saveSingleAnswer(questionUid) {
      if (!attemptUid || isFinishing) return;
      const q = questions.find(item => item.questionUid === questionUid);
      if (!q) return;

      const payload = collectQuestionPayload(q);
      if (!payload) return;

      const statusEl = document.getElementById('save-status');
      statusEl.textContent = 'Сохранение...';
      try {
        await apiRequest('taking', `/api/attempts/${attemptUid}/answer`, {
          method: 'POST',
          body: payload
        });
        statusEl.textContent = 'Ответ сохранён';
      } catch (err) {
        statusEl.textContent = '';
        showAlert('alert', err.message);
      }
    }

    function startTimer(expiresAt) {
      const el = document.getElementById('timer');
      el.style.display = 'inline-block';

      const tick = () => {
        const diff = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        el.textContent = `Осталось: ${m}:${s}`;
        if (diff === 0 && !isFinishing) {
          clearInterval(timerInterval);
          finishAttempt();
        }
      };

      tick();
      timerInterval = setInterval(tick, 1000);
    }

    async function finishAttempt() {
      if (isFinishing || !attemptUid) return;
      isFinishing = true;
      hideAlert('alert');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Проверка ответов...';

      try {
        // Финально сохраняем все заполненные ответы
        for (const q of questions) {
          const payload = collectQuestionPayload(q);
          if (payload) {
            await apiRequest('taking', `/api/attempts/${attemptUid}/answer`, {
              method: 'POST',
              body: payload
            });
          }
        }

        await apiRequest('taking', `/api/attempts/${attemptUid}/finish`, {
          method: 'POST'
        });

        window.location.href = `result.html?attemptUid=${attemptUid}`;
      } catch (err) {
        isFinishing = false;
        btn.disabled = false;
        btn.textContent = 'Завершить тест и узнать результат';
        showAlert('alert', err.message);
      }
    }

    document.getElementById('attempt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await finishAttempt();
    });

    initAttempt();
  </script>
</body>
</html>
