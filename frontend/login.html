<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — KnowledgeControl</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="topbar"></header>
  <main class="container container-narrow">
    <div class="page-header">
      <div>
        <h1>Вход в систему</h1>
        <p class="page-subtitle">Используйте учётную запись студента или автора</p>
      </div>
    </div>

    <div id="alert" class="alert"></div>
    <form id="login-form" class="card">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
      <p class="muted" style="margin:14px 0 0;text-align:center;">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavbar();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await apiRequest('user', '/api/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          }
        });
        localStorage.setItem('kc_token', res.token || res.accessToken);
        window.location.href = 'index.html';
      } catch (err) {
        showAlert('alert', err.message);
      }
    });
  </script>
</body>
</html>
