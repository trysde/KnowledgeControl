<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мои тесты — KnowledgeControl</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="topbar"></header>
  <main class="container">
    <div class="page-header">
      <div>
        <h1>Мои тесты</h1>
        <p class="page-subtitle">Управление черновиками, публикация в каталог и просмотр статистики</p>
      </div>
      <a href="test-edit.html" class="btn btn-primary">+ Создать тест</a>
    </div>

    <div id="alert" class="alert"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Название</th>
            <th>Статус</th>
            <th>Вопросы / Баллы</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="tests-body">
          <tr><td colspan="4" class="muted">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();
    renderNavbar('tests');

    function statusBadge(test) {
      if (test.isHidden || test.status === 'Blocked') {
        return '<span class="badge badge-danger">Скрыт / Заблокирован</span>';
      }
      if (test.status === 'Published') {
        return '<span class="badge badge-success">Опубликован</span>';
      }
      if (test.status === 'Archived') {
        return '<span class="badge badge-warn">В архиве</span>';
      }
      return '<span class="badge">Черновик</span>';
    }

    async function loadMyTests() {
      try {
        const list = await apiRequest('creation', '/api/tests/my');
        const tbody = document.getElementById('tests-body');

        if (!Array.isArray(list) || !list.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="muted">У вас пока нет созданных тестов.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(t => {
          const isBlocked = t.isHidden || t.status === 'Blocked';
          const isPublished = t.status === 'Published' && !t.isHidden;

          return `
            <tr>
              <td>
                <strong>${escapeHtml(t.title)}</strong>
                <div class="muted">${escapeHtml(t.categoryName || '')} · Проходной балл: ${t.passingScore}%</div>
              </td>
              <td>${statusBadge(t)}</td>
              <td class="mono">${t.questionsCount} вопр. / ${t.totalPoints} б.</td>
              <td>
                <div class="row-actions">
                  ${!isBlocked ? `<a href="test-edit.html?uid=${t.uid}" class="btn btn-sm">Редактировать</a>` : ''}
                  <a href="test-stats.html?testUid=${t.uid}" class="btn btn-sm">Статистика</a>
                  ${!isBlocked && !isPublished
                    ? `<button class="btn btn-sm btn-primary" onclick="publishTest('${t.uid}')">Опубликовать</button>`
                    : ''}
                  ${isPublished
                    ? `<button class="btn btn-sm btn-danger" onclick="unpublishTest('${t.uid}')">Снять с публикации</button>`
                    : ''}
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    async function publishTest(uid) {
      hideAlert('alert');
      try {
        await apiRequest('creation', `/api/tests/${uid}/publish`, { method: 'POST' });
        showAlert('alert', 'Тест опубликован и добавлен в каталог.', 'success');
        loadMyTests();
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    async function unpublishTest(uid) {
      if (!confirm('Снять тест с публикации? Он исчезнет из общего каталога.')) return;
      hideAlert('alert');
      try {
        await apiRequest('creation', `/api/tests/${uid}/unpublish`, { method: 'POST' });
        showAlert('alert', 'Тест снят с публикации и переведён в черновики.', 'success');
        loadMyTests();
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    loadMyTests();
  </script>
</body>
</html>
