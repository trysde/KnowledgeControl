<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактор вопроса — KnowledgeControl</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="topbar"></header>
  <main class="container" style="max-width:720px;">
    <div class="page-header">
      <div>
        <h1 id="page-title">Новый вопрос</h1>
        <p class="page-subtitle">Формулировка, тип ответа и правильные варианты</p>
      </div>
      <a href="questions.html" class="btn">Назад к списку</a>
    </div>

    <div id="alert" class="alert"></div>
    <form id="question-form" class="card">
      <div class="form-group">
        <label for="text">Формулировка вопроса</label>
        <textarea id="text" required></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="type">Тип вопроса</label>
          <select id="type" onchange="toggleType()">
            <option value="SingleChoice">Один вариант (SingleChoice)</option>
            <option value="MultipleChoice">Несколько вариантов (MultipleChoice)</option>
            <option value="Text">Текстовый ввод (Text)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="points">Баллы за правильный ответ</label>
          <input type="number" id="points" value="1" min="1" required>
        </div>
      </div>

      <div id="options-section" class="form-group">
        <label>Варианты ответа (отметьте правильные)</label>
        <div id="options-list"></div>
        <button type="button" class="btn btn-sm" style="margin-top:8px;" onclick="addOptionRow()">+ Добавить вариант</button>
      </div>

      <div id="text-answer-section" class="form-group" style="display:none;">
        <label for="correctText">Эталонный текстовый ответ</label>
        <input type="text" id="correctText" placeholder="Точное совпадение (без учёта регистра)">
      </div>

      <div style="margin-top:18px;display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Сохранить вопрос</button>
        <a href="questions.html" class="btn">Отмена</a>
      </div>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();
    renderNavbar('questions');
    const questionId = new URLSearchParams(window.location.search).get('id');

    function toggleType() {
      const isText = document.getElementById('type').value === 'Text';
      document.getElementById('options-section').style.display = isText ? 'none' : 'block';
      document.getElementById('text-answer-section').style.display = isText ? 'block' : 'none';
    }

    function addOptionRow(text = '', isCorrect = false) {
      const container = document.getElementById('options-list');
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px;';
      row.innerHTML = `
        <input type="checkbox" class="opt-correct" ${isCorrect ? 'checked' : ''} title="Правильный ответ">
        <input type="text" class="opt-text" value="${text.replace(/"/g, '&quot;')}" placeholder="Текст варианта">
        <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(row);
    }

    async function init() {
      if (!questionId) {
        addOptionRow();
        addOptionRow();
        return;
      }
      document.getElementById('page-title').textContent = 'Редактирование вопроса';
      try {
        const q = await apiRequest('creation', `/api/questions/${questionId}`);
        document.getElementById('text').value = q.text;
        document.getElementById('type').value = q.type || 'SingleChoice';
        document.getElementById('points').value = q.points ?? 1;
        document.getElementById('correctText').value = q.correctText || '';
        toggleType();
        (q.options || []).forEach(o => addOptionRow(o.text, o.isCorrect));
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    document.getElementById('question-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const options = type === 'Text' ? [] : Array.from(document.querySelectorAll('#options-list > div')).map(row => ({
        text: row.querySelector('.opt-text').value.trim(),
        isCorrect: row.querySelector('.opt-correct').checked
      })).filter(o => o.text);

      const payload = {
        text: document.getElementById('text').value.trim(),
        type,
        points: Number(document.getElementById('points').value),
        options,
        correctText: type === 'Text' ? document.getElementById('correctText').value.trim() : null
      };

      try {
        if (questionId) {
          await apiRequest('creation', `/api/questions/${questionId}`, { method: 'PUT', body: payload });
        } else {
          await apiRequest('creation', '/api/questions', { method: 'POST', body: payload });
        }
        window.location.href = 'questions.html';
      } catch (err) {
        showAlert('alert', err.message);
      }
    });

    init();
  </script>
</body>
</html>
