<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог тестов — KnowledgeControl</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="topbar"></header>
  <main class="container">
    <div class="page-header">
      <div>
        <h1>Каталог тестов</h1>
        <p class="page-subtitle">Опубликованные проверочные материалы</p>
      </div>
      <a href="search.html" class="btn">Расширенный поиск</a>
    </div>

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <div class="row-actions" id="mode-tabs">
        <button type="button" class="btn btn-sm btn-primary" data-mode="all" onclick="setMode('all')">Все тесты</button>
        <button type="button" class="btn btn-sm" data-mode="popular" onclick="setMode('popular')">Популярные</button>
        <button type="button" class="btn btn-sm" data-mode="new" onclick="setMode('new')">Новые</button>
      </div>
      <div id="category-filter-wrap" style="min-width:220px;">
        <select id="category-select" onchange="onCategoryChange()">
          <option value="">Все категории</option>
        </select>
      </div>
    </div>

    <div id="alert" class="alert"></div>
    <div id="tests-grid" class="grid-2">
      <p class="muted">Загрузка каталога...</p>
    </div>

    <div id="pagination" style="display:none;justify-content:space-between;align-items:center;margin-top:16px;">
      <button type="button" id="prev-btn" class="btn btn-sm" onclick="changePage(-1)">← Назад</button>
      <span id="page-info" class="muted mono"></span>
      <button type="button" id="next-btn" class="btn btn-sm" onclick="changePage(1)">Вперёд →</button>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavbar('index');

    let currentMode = 'all';
    let currentCategory = '';
    let currentPage = 1;
    const pageSize = 10;

    async function loadCategories() {
      try {
        const categories = await apiRequest('creation', '/api/categories');
        const select = document.getElementById('category-select');
        (categories || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
      } catch { /* каталог работает и без списка категорий */ }
    }

    function setMode(mode) {
      currentMode = mode;
      currentPage = 1;
      document.querySelectorAll('#mode-tabs button').forEach(btn => {
        btn.className = btn.dataset.mode === mode ? 'btn btn-sm btn-primary' : 'btn btn-sm';
      });
      document.getElementById('category-filter-wrap').style.display = mode === 'all' ? 'block' : 'none';
      loadCatalog();
    }

    function onCategoryChange() {
      currentCategory = document.getElementById('category-select').value;
      currentPage = 1;
      loadCatalog();
    }

    function changePage(delta) {
      currentPage = Math.max(1, currentPage + delta);
      loadCatalog();
    }

    function renderCards(items) {
      const grid = document.getElementById('tests-grid');
      if (!items.length) {
        grid.innerHTML = '<p class="muted">Опубликованных тестов по выбранным условиям пока нет.</p>';
        return;
      }

      grid.innerHTML = items.map(t => {
        const updated = t.updatedAt ? new Date(t.updatedAt).toLocaleDateString('ru-RU') : '';
        const statsLine = t.totalAttempts > 0
          ? `Попыток: <strong>${t.totalAttempts}</strong> · Успешно: ${Math.round(t.passRate)}% · Ср. балл: ${Math.round(t.avgScore)}%`
          : 'Пока нет прохождений';

        return `
          <div class="card" style="display:flex;flex-direction:column;justify-content:space-between;margin-bottom:0;">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
                <span class="badge">${escapeHtml(t.subject || 'Общее')}</span>
                <span class="mono muted">${updated}</span>
              </div>
              <h3 style="margin:0 0 6px;font-size:17px;">${escapeHtml(t.title)}</h3>
              <p class="muted" style="margin:0 0 14px;">${escapeHtml(t.description || 'Описание отсутствует')}</p>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border);">
              <span class="muted">${statsLine}</span>
              <a href="take-test.html?testUid=${t.testUid}" class="btn btn-sm btn-primary">Пройти</a>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadCatalog() {
      hideAlert('alert');
      const paginationEl = document.getElementById('pagination');

      try {
        if (currentMode === 'popular') {
          paginationEl.style.display = 'none';
          const items = await apiRequest('search', '/api/catalog/popular?limit=12');
          renderCards(Array.isArray(items) ? items : []);
          return;
        }

        if (currentMode === 'new') {
          paginationEl.style.display = 'none';
          const items = await apiRequest('search', '/api/catalog/new?limit=12');
          renderCards(Array.isArray(items) ? items : []);
          return;
        }

        const params = new URLSearchParams({
          page: String(currentPage),
          size: String(pageSize)
        });
        if (currentCategory) params.set('category', currentCategory);

        const data = await apiRequest('search', `/api/catalog?${params.toString()}`);
        const items = data?.items || [];
        renderCards(items);

        if (data && data.totalPages > 1) {
          paginationEl.style.display = 'flex';
          document.getElementById('page-info').textContent =
            `Страница ${data.page} из ${data.totalPages} (всего: ${data.totalCount})`;
          document.getElementById('prev-btn').disabled = data.page <= 1;
          document.getElementById('next-btn').disabled = data.page >= data.totalPages;
        } else {
          paginationEl.style.display = 'none';
        }
      } catch (e) {
        showAlert('alert', e.message);
      }
    }

    loadCategories();
    loadCatalog();
  </script>
</body>
</html>
