# ============================================================
# KnowledgeControl — инфраструктурные сервисы
# ============================================================
# Поднимает 3 инфраструктурных сервиса, необходимых для работы
# всех четырёх микросервисов проекта:
#   1. PostgreSQL — единая БД KnowledgeDb с 4 логическими схемами
#   2. RabbitMQ   — брокер сообщений для асинхронного обмена
#   3. Redis      — распределённый кэш (решение «на 5»)
#
# Запуск:  docker-compose up -d
# Стоп:    docker-compose down
# Сброс БД (удалить данные): docker-compose down -v
#
# Пароли и порты берутся из .env — не храните секреты здесь!
# ============================================================

services:
  postgres:
    image: postgres:16
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Кодировка UTF-8 для корректной работы с русским текстом
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Persistence данных между перезапусками контейнера
      - postgres_data:/var/lib/postgresql/data
      # Init-скрипт выполняется только при пустом volume
      # (то есть только при первом `docker-compose up`)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: knowledge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"      # AMQP (для сервисов)
      - "${RABBITMQ_MGMT_PORT}:15672"     # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - knowledge-net

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge-net

volumes:
  postgres_data:
    name: knowledge-postgres-data
  rabbitmq_data:
    name: knowledge-rabbitmq-data
  redis_data:
    name: knowledge-redis-data

networks:
  knowledge-net:
    name: knowledge-net
    driver: bridge
